[package]
name = "s10_ringctrl"
version = "0.1.0"
edition = "2024"
authors = ["mobius"]
description = "S10 Bluetooth Remote Input Remapper"
license = "MIT"

[dependencies]
evdev = "0.12"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
