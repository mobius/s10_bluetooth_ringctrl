[device]
touch = "/dev/input/event22"
consumer = "/dev/input/event23"

[gesture]
threshold = 80
double_tap_ms = 500

# ============================================
# 当前激活: herdr 终端管理器映射
# ============================================
# Agent 列表:
#   grok  → pane w651fddbbf986d1-1  (cwd: /home/joey/Work/dev/temp)
#   kimi  → pane w651fddbbf986d1-2  (cwd: /home/joey/Work/dev/temp/bluetooth)
#
# 如需切回 Hyprland 全局操作，注释掉下方 [mappings] 整段，
# 取消注释底部的「方案 B: Hyprland」即可。
# ============================================
[mappings]
# --- 发给 kimi (bluetooth 工作区) ---
TAP        = "command:herdr agent send kimi 'cargo test'"
UP         = "command:herdr agent send kimi 'cargo build --release'"
DOWN       = "command:herdr agent send kimi 'cargo run'"
LEFT       = "command:herdr agent send kimi 'git status'"
RIGHT      = "command:herdr agent send kimi 'git push'"

# --- 发给 grok (temp 工作区) ---
DOUBLE_TAP = "command:herdr agent send grok 'make test'"

# --- Power 键 (消费者控制) ---
KEY_VOLUMEUP = "command:herdr agent send kimi 'exit'"

