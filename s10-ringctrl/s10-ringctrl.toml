[device]
touch = "/dev/input/event22"
consumer = "/dev/input/event23"

[gesture]
threshold = 80
double_tap_ms = 500

# ============================================
# herdr 终端管理器映射
# ============================================
# UP/DOWN    → 切换 herdr workspace
# LEFT/RIGHT → 切换 herdr agent
# TAP        → 发送 "继续" 到当前 agent
# DOUBLE_TAP → 发送两个 Esc 到当前 agent（取消行为）
# ============================================
[mappings]
UP         = "command:/home/joey/Work/dev/temp/bluetooth/s10-ringctrl/s10-herdr.sh prev-workspace"
DOWN       = "command:/home/joey/Work/dev/temp/bluetooth/s10-ringctrl/s10-herdr.sh next-workspace"
LEFT       = "command:/home/joey/Work/dev/temp/bluetooth/s10-ringctrl/s10-herdr.sh prev-agent"
RIGHT      = "command:/home/joey/Work/dev/temp/bluetooth/s10-ringctrl/s10-herdr.sh next-agent"
TAP        = "command:/home/joey/Work/dev/temp/bluetooth/s10-ringctrl/s10-herdr.sh send-text '继续'"
DOUBLE_TAP = "command:/home/joey/Work/dev/temp/bluetooth/s10-ringctrl/s10-herdr.sh esc-esc"

# Power 键映射
KEY_VOLUMEUP = "command:/home/joey/Work/dev/temp/bluetooth/s10-ringctrl/s10-herdr.sh esc-esc"
