alt_config = "s10-ringctrl-hyprland.toml"

[device]
touch = "/dev/input/event22"
consumer = "/dev/input/event23"

[gesture]
threshold = 80

[mappings]
UP = "command:./s10-herdr.sh next-workspace"
DOWN = "command:./s10-herdr.sh prev-workspace"
LEFT = "command:./s10-herdr.sh next-agent"
RIGHT = "command:./s10-herdr.sh prev-agent"
TAP = "text:继续"
POWER = "key:Escape"
